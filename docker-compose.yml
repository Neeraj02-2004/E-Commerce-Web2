services:
  postgres:
    image: postgres:16-alpine
    container_name: springecom-postgres
    environment:
      POSTGRES_DB: springecom
      POSTGRES_USER: springecom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - springecom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springecom -d springecom"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: springecom-redis
    ports:
      - "6379:6379"
    volumes:
      - springecom-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springecom-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/springecom
      DB_USERNAME: springecom
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 3600000
      CORS_ORIGINS: ${CORS_ORIGINS}
      PRODUCT_IMAGES_DIR: /app/uploads/products
    ports:
      - "8080:8080"
    volumes:
      - springecom-product-images:/app/uploads/products

volumes:
  springecom-postgres-data:
  springecom-redis-data:
  springecom-product-images:
