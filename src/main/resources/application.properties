spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.application.name=SpringEcom

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/springecom_flyway}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000

spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false
spring.cache.redis.time-to-live=600000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

app.upload.product-images-dir=${PRODUCT_IMAGES_DIR:uploads/products}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=SpringEcom
info.app.description=Spring Boot Ecommerce API
info.app.version=0.0.1-SNAPSHOT
