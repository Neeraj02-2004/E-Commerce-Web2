services:
  postgres:
    image: postgres:16-alpine
    container_name: springecom-postgres
    environment:
      POSTGRES_DB: springecom
      POSTGRES_USER: springecom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - springecom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springecom -d springecom"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: springecom-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env for production}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - springecom-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springecom-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/springecom
      DB_USERNAME: springecom
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_TYPE: cloudinary
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  springecom-postgres-data:
  springecom-redis-data: