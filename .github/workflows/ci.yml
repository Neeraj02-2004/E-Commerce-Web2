name: Backend CI

on:
  push:
    branches:
      - backend
      - main
      - master
  pull_request:
    branches:
      - backend
      - main
      - master

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:27-dind
        options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        env:
          DB_PASSWORD: test-password
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          JWT_SECRET: bFJiTGtSdXFXcXJyQkRCZVNnRys4MXlsNEdINkFmQVdYTWFiWWxtbCtNPQ==
          CORS_ORIGINS: http://localhost:5173
        run: ./mvnw test